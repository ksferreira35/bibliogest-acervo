apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: bibliogest
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-internal
  namespace: bibliogest
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - acervo
          - reservas
          - keycloak
          - database-init
          - pgadmin
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: applications-from-ingress
  namespace: bibliogest
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - acervo
      - reservas
      - frontend
      - keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '@@INGRESS_NAMESPACE@@'
      podSelector:
        matchLabels:
          '@@INGRESS_LABEL_KEY@@': '@@INGRESS_LABEL_VALUE@@'
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-jwks
  namespace: bibliogest
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - acervo
          - reservas
    ports:
    - protocol: TCP
      port: 8080
