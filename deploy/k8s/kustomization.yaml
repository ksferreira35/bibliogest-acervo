apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bibliogest
resources:
- 00-namespace.yaml
- 01-config.yaml
- 02-network-policies.yaml
- 10-postgres.yaml
- 11-databases.yaml
- 20-keycloak.yaml
- 30-acervo.yaml
- 31-reservas.yaml
- 40-frontend.yaml
- 45-pgadmin.yaml
- 50-ingress.yaml
configMapGenerator:
- name: keycloak-realm
  files:
  - bibliogest-realm.json=realm-bibliogest.json
- name: pgadmin-servers
  files:
  - servers.json=pgadmin-servers.json
generatorOptions:
  disableNameSuffixHash: true
