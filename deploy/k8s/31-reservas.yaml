apiVersion: v1
kind: Service
metadata:
  name: reservas
  namespace: bibliogest
spec:
  selector:
    app: reservas
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas
  namespace: bibliogest
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: reservas
  template:
    metadata:
      labels:
        app: reservas
      annotations:
        bibliogest/config-checksum: '@@CONFIG_CHECKSUM@@'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: reservas
        image: '@@RESERVAS_IMAGE@@'
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/bibliogest_reservas
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: reservas-db
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reservas-db
              key: password
        envFrom:
        - configMapRef:
            name: bibliogest-config
        startupProbe:
          httpGet:
            path: /reservas/actuator/health/liveness
            port: 8080
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /reservas/actuator/health/readiness
            port: 8080
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /reservas/actuator/health/liveness
            port: 8080
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
